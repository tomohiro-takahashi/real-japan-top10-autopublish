name: Daily Retro Music 1-Hour & Shorts Auto-Upload

on:
  schedule:
    # Runs daily at 11:00 UTC (20:00 JST / 07:00 EDT / 12:00 London)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube Privacy Status (public / unlisted / private)'
        required: false
        default: 'public'
      duration:
        description: '1-Hour Video Duration in Seconds (default: 3600)'
        required: false
        default: '3600'

permissions:
  contents: write

concurrency:
  group: daily-music-upload
  cancel-in-progress: false

jobs:
  build-and-upload-music:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build 1-Hour Music Video + Short & Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SUNO_COOKIE: ${{ secrets.SUNO_COOKIE }}
          SUNO_API_BASE_URL: ${{ secrets.SUNO_API_BASE_URL }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          DURATION="${{ github.event.inputs.duration || '3600' }}"
          python build_music_video.py --privacy "$PRIVACY" --duration "$DURATION"

name: Real 80s-90s Western Legend 2-Hour Full Mix Auto-Upload

on:
  schedule:
    # Slot 2: Runs 1x daily at 07:30 UTC (16:30 JST) -> pre-builds 2-Hour Real Western Mix and auto-publishes at 19:30 JST Golden Time
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      mix_id:
        description: 'Optional Mix ID (e.g. real_mix_001 .. real_mix_008; leave blank for next unused)'
        required: false
        default: ''
      privacy:
        description: 'YouTube Privacy Status (public / unlisted / private)'
        required: false
        default: 'public'
      publish_now:
        description: 'Publish immediately instead of scheduling for Golden Time (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-real-hits-mix
  cancel-in-progress: false

jobs:
  build-and-upload-real-hits-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and CJK Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-cjk

      - name: Install Python Dependencies (including latest yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Build Full-Length 12-Song Western Hit Mix + Short & Upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_MUSIC: ${{ secrets.YOUTUBE_CLIENT_ID_MUSIC }}
          YOUTUBE_CLIENT_SECRET_MUSIC: ${{ secrets.YOUTUBE_CLIENT_SECRET_MUSIC }}
          YOUTUBE_REFRESH_TOKEN_MUSIC: ${{ secrets.YOUTUBE_REFRESH_TOKEN_MUSIC }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          MIX_ID="${{ github.event.inputs.mix_id || '' }}"
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.publish_now }}" = "true" ]; then
            EXTRA_ARGS="--publish-now"
          fi
          if [ -n "$MIX_ID" ]; then
            python real_hits_mix_builder.py --privacy "$PRIVACY" --mix-id "$MIX_ID" $EXTRA_ARGS
          else
            python real_hits_mix_builder.py --privacy "$PRIVACY" $EXTRA_ARGS
          fi
